name: release

# Publishing happens only here: push a tag, and the workflow checks it against
# the project version, runs the quality gate, and pushes to NuGet. Never publish
# from a developer console.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  # GitHub OIDC token, exchanged by nuget.org for a short-lived key.
  id-token: write
  # For the GitHub Packages mirror below.
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: The tag must match the project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('src/EventfulRanges/EventfulRanges.csproj').getroot().findtext('PropertyGroup/Version'))")
          echo "tag ${tag_version}, project ${project_version}"
          test "${tag_version}" = "${project_version}"

      - name: Quality gate
        run: ./scripts/quality-gate.sh

      - name: Pack
        run: ./scripts/pack.sh

      # The mirror goes first: if nuget.org rejects the push, the bits are still
      # reachable from the repository, and a retry is idempotent either way.
      # GitHub's NuGet feed has no symbol server, so only the package is mirrored.
      - name: Mirror to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "build/packages/*.nupkg" \
            --api-key "${GITHUB_TOKEN}" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

      # Trusted Publishing: there is no long-lived key to store or rotate.
      # nuget.org checks GitHub's signed OIDC token against a policy and issues
      # a one-hour key, so the login must sit right before the push.
      #
      # One-time setup on nuget.org (Trusted Publishing → add policy):
      #   repository owner  d-led
      #   repository        eventfulranges.net
      #   workflow file     release.yml
      - name: NuGet login (OIDC to a temporary key)
        id: login
        uses: NuGet/login@v1
        with:
          # The nuget.org profile name, not the email address.
          user: d-led

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "build/packages/*.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "build/packages/*.snupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
